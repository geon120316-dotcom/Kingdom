<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>정화의 왕국 - 전투 프로토타입</title>
  <style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#game{position:relative;width:min(100vw,520px);height:100dvh;min-height:600px;background:#111;overflow:hidden;box-shadow:0 0 50px #000}
.topbar{height:66px;display:flex;align-items:center;padding:9px 12px;gap:10px;background:linear-gradient(#1d2028,#11141a);border-bottom:1px solid #3a3e49;position:relative;z-index:10}
.stage{line-height:1.05;flex:1}.stage small{display:block;color:#8d96a8;font-size:10px;letter-spacing:1.5px}.stage b{font-size:17px}
.resource{height:38px;min-width:105px;border:1px solid #555b68;border-radius:20px;background:#171a20;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.coin-icon{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5a0 0 8%,#e7ad32 9% 58%,#8a5411 60% 100%);border:2px solid #ffe17b;box-shadow:0 0 8px #d59625}
.top-btn{width:38px;height:38px;border-radius:12px;background:#292e38;border:1px solid #535a68;color:#b9c0cc}

.battle{height:calc(100% - 66px - 250px);min-height:330px;position:relative;overflow:hidden;background:radial-gradient(circle at 65% 25%,#3b4258 0,#222735 30%,#14171f 70%);border-bottom:1px solid #353946}
.moon{position:absolute;width:105px;height:105px;border-radius:50%;right:38px;top:34px;background:radial-gradient(circle at 40% 35%,#e8e8d0,#8d92a1 60%,#555a67);opacity:.5;filter:blur(.2px)}
.mist{position:absolute;inset:35% -20% 0;background:radial-gradient(ellipse,#77808c33 0,#aeb3bb12 35%,transparent 70%);filter:blur(15px)}
.ground{position:absolute;left:-10%;right:-10%;bottom:0;height:34%;background:linear-gradient(180deg,#242832,#111319);clip-path:polygon(0 30%,15% 18%,30% 28%,47% 13%,65% 29%,82% 15%,100% 25%,100% 100%,0 100%);border-top:1px solid #343a47}
.ruins{position:absolute;bottom:25%;background:#181b22;border:3px solid #2e333d;opacity:.75}.ruin1{left:4%;width:80px;height:120px;clip-path:polygon(0 100%,5% 22%,30% 28%,34% 0,53% 7%,63% 38%,91% 30%,100% 100%)}.ruin2{right:17%;width:115px;height:85px;clip-path:polygon(0 100%,7% 20%,31% 35%,42% 0,63% 20%,71% 8%,100% 35%,100% 100%)}

.enemy-info{position:absolute;top:16px;left:18px;right:18px;z-index:6}.name-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:5px}.name-row span{color:#aeb5c2;font-size:11px}.hp-shell{height:11px;background:#090b0f;border:1px solid #555a65;border-radius:7px;overflow:hidden}.hp{height:100%;transition:width .25s}.hp.enemy{background:linear-gradient(90deg,#c83333,#ff6b48);box-shadow:0 0 8px #f44}.hp-text{text-align:right;font-size:10px;color:#c4cad3;margin-top:3px}

.fighter{position:absolute;z-index:4;transform-origin:center bottom;will-change:transform}.fighter img{width:100%;height:100%;object-fit:contain;display:block}.hero-fighter{width:145px;height:205px;left:9%;bottom:14%}.monster-fighter{width:225px;height:245px;right:3%;bottom:8%}
.unit-hp{position:absolute;left:24%;right:24%;top:-10px;height:6px;background:#0a0b0e;border:1px solid #555;border-radius:4px;overflow:hidden}.hp.ally{background:linear-gradient(90deg,#35b86b,#91e36e)}.unit-name{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:10px;color:#d4d8df;text-shadow:0 2px 3px #000}
.hero-fighter.attack{animation:heroAttack .42s ease}.hero-fighter.hit{animation:heroHit .24s}.monster-fighter.hit{animation:monsterHit .25s}.monster-fighter.dead{animation:monsterDeath .65s forwards}
@keyframes heroAttack{0%{transform:translateX(0)}45%{transform:translateX(95px) scale(1.04)}100%{transform:translateX(0)}}@keyframes heroHit{0%,100%{transform:translateX(0)}40%{transform:translateX(-8px)}}@keyframes monsterHit{0%,100%{transform:translateX(0)}35%{transform:translateX(10px) rotate(-1deg)}}
@keyframes monsterDeath{to{transform:translateY(35px) scale(.7);opacity:0;filter:grayscale(1)}}
.damage{position:absolute;z-index:9;font-size:26px;font-weight:900;color:#fff5bc;text-shadow:0 2px 0 #6c2500,0 0 9px #ff5a00;animation:floatD .8s ease forwards;pointer-events:none}.damage.crit{font-size:34px;color:#fff}.heal{color:#86ff9b!important;text-shadow:0 2px #064d1a!important}
@keyframes floatD{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.battle-log{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:92%;text-align:center;color:#aeb5c1;font-size:11px;background:#0c0e1290;border:1px solid #323640;border-radius:8px;padding:6px;z-index:8}.speed{position:absolute;right:10px;bottom:45px;z-index:9;display:flex;gap:5px;align-items:center}.speed button{font-size:10px;background:#20242c;border:1px solid #4a505b;border-radius:8px;padding:5px 7px}.speed span{font-size:11px;color:#bfc5cf}

.command{height:250px;background:linear-gradient(#191c23,#0d0f14);padding:9px 11px 12px;position:relative;z-index:10;border-top:1px solid #333844}.status-row{height:29px;display:flex;align-items:center;justify-content:space-between;font-size:12px}.status-row span{margin-left:6px;color:#9098a8}.mana{width:43%;height:7px;border-radius:5px;background:#080a0d;border:1px solid #444a55;overflow:hidden}.mana i{display:block;width:55%;height:100%;background:linear-gradient(90deg,#2867c7,#58b8ff)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:4px 0 10px}.skill{height:96px;border:1px solid #454b57;background:linear-gradient(#2a2f38,#171a20);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px #ffffff12}.skill:active{transform:scale(.97);background:#333944}.skill-art{width:43px;height:43px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:2px;background:radial-gradient(circle,#697384,#252a33);border:1px solid #858c99}.skill b{font-size:10px}.skill small{font-size:8px;color:#8f98a7}.ultimate{color:#ffe4a1}
.bottom-row{display:grid;grid-template-columns:82px 1fr 62px;gap:7px}.bottom-row button{height:48px;border-radius:10px;border:1px solid #4d5360;background:#20242c;font-weight:800;font-size:12px}.auto.on{border-color:#6d8d72;background:#243229;color:#a7e2ae}.auto span{display:block;font-size:8px;color:#72bd7b;margin-top:2px}.battle-btn{background:linear-gradient(#8e572f,#5b321e)!important;border-color:#b77a4b!important}.retreat{color:#9ca4b2}

.overlay,.result{position:absolute;inset:0;z-index:30;background:#07090dcc;display:flex;align-items:center;justify-content:center}.hidden{display:none}.pause-card,.result-card{width:82%;padding:26px 22px;border:1px solid #565d69;border-radius:15px;background:linear-gradient(#252a33,#12151a);text-align:center;box-shadow:0 20px 60px #000}.pause-card h2{margin:0 0 22px;font-size:20px}.pause-card button,.result-card button{width:100%;height:48px;border-radius:9px;background:linear-gradient(#8b5b37,#54301f);border:1px solid #c18a5a;font-weight:800}.result-title{font-size:22px;font-weight:900;margin-bottom:7px}.result-sub{font-size:12px;color:#aeb5c0}.reward{margin:22px 0;font-size:22px;font-weight:900;display:flex;justify-content:center;gap:9px;align-items:center}
@media(max-height:700px){.command{height:230px}.battle{height:calc(100% - 66px - 230px)}.skill{height:82px}.hero-fighter{height:175px}.monster-fighter{height:210px}}
</style>
</head>

    <div id="monster" class="fighter monster-fighter">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMzAgMzUwIj4KPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJtIiB5MT0iMCIgeTI9IjEiPjxzdG9wIHN0b3AtY29sb3I9IiM0YjUwNWMiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMxYTFkMjUiLz48L2xpbmVhckdyYWRpZW50PjxsaW5lYXJHcmFkaWVudCBpZD0idiI+PHN0b3Agc3RvcC1jb2xvcj0iIzllMzgyZiIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzMyMTUxNiIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPgo8ZWxsaXBzZSBjeD0iMTcyIiBjeT0iMzI5IiByeD0iMTA1IiByeT0iMTMiIGZpbGw9IiMwMDAiIG9wYWNpdHk9Ii41NSIvPgo8cGF0aCBkPSJNODMgMTIzIFE1NCA1NSAxMTAgMzEgTDEzOSA3NCBRMTc0IDQzIDIxNyA3NSBMMjU0IDMzIFEyODYgNzcgMjYwIDEzMSBMMjgxIDIyMSBRMjYwIDI4NiAyMDIgMzA1IEwxMTggMjk3IFE2NiAyNjYgNTcgMjEzWiIgZmlsbD0idXJsKCNtKSIgc3Ryb2tlPSIjMTExNDFhIiBzdHJva2Utd2lkdGg9IjkiLz4KPHBhdGggZD0iTTk3IDEzMyBRMTcwIDkyIDI0NyAxMzQgTDIzMSAyMTMgUTE3MSAyNDEgMTAzIDIxMloiIGZpbGw9IiMyOTJkMzYiLz4KPHBhdGggZD0iTTEwOCAxMDUgTDE0NSA5MiBMMTYyIDEyMSBMMTIxIDEzMlogTTE5OCA5MSBMMjM1IDEwOCBMMjIxIDEzMiBMMTgxIDEyMFoiIGZpbGw9IiMxNzFhMjAiLz4KPHBhdGggZD0iTTEwOCAxMTMgTDE0MyAxMjEiIHN0cm9rZT0iI2U2NWE0MyIgc3Ryb2tlLXdpZHRoPSI4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNMTkwIDEyMSBMMjI0IDExMiIgc3Ryb2tlPSIjZTY1YTQzIiBzdHJva2Utd2lkdGg9IjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgo8cGF0aCBkPSJNMTMxIDE1NSBRMTcwIDE3NyAyMDkgMTU1IEwyMDEgMjAyIFExNzAgMjE4IDEzOSAyMDJaIiBmaWxsPSIjMTcxYTIwIiBzdHJva2U9IiMwYzBlMTIiIHN0cm9rZS13aWR0aD0iNSIvPgo8cGF0aCBkPSJNMTQ0IDE4MSBMMTU1IDE5NCBMMTY0IDE4MSBMMTc0IDE5NyBMMTg0IDE4MCBMMTk0IDE5MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOGQzMDJhIiBzdHJva2Utd2lkdGg9IjUiLz4KPHBhdGggZD0iTTY5IDE0OSBMMjYgMTk1IEw2NyAyMzEiIGZpbGw9IiMzNzNjNDciIHN0cm9rZT0iIzExMTQxYSIgc3Ryb2tlLXdpZHRoPSI4Ii8+PHBhdGggZD0iTTI2MyAxNDggTDMwNyAxOTQgTDI2NyAyMzIiIGZpbGw9IiMzNzNjNDciIHN0cm9rZT0iIzExMTQxYSIgc3Ryb2tlLXdpZHRoPSI4Ii8+CjxwYXRoIGQ9Ik05NSAyMzkgTDY4IDMwNiBMMTE2IDI4NiBMMTM4IDMwNiBMMTUxIDIzNloiIGZpbGw9IiMzMDM1M2YiIHN0cm9rZT0iIzExMTQxYSIgc3Ryb2tlLXdpZHRoPSI4Ii8+CjxwYXRoIGQ9Ik0xOTkgMjM3IEwyMTggMzA2IEwyNjAgMjg3IEwyNDAgMjI4WiIgZmlsbD0iIzMwMz <script>const $=s=>document.querySelector(s);
const hero=$("#hero"), monster=$("#monster"), enemyHp=$("#enemyHp"), enemyHpText=$("#enemyHpText");
const heroHp=$("#heroHp"), manaFill=$("#manaFill"), damageLayer=$("#damageLayer"), log=$("#battleLog");
const battleBtn=$("#battleBtn"), autoBtn=$("#autoBtn"), speedBtn=$("#speedBtn");
let state={enemy:8000,hero:1000,mana:55,running:false,auto:true,speed:1,guard:false,attacking:false,dead:false};

function fmt(n){return Math.max(0,Math.round(n)).toLocaleString("ko-KR")}
function update(){
  enemyHp.style.width=(state.enemy/8000*100)+"%"; enemyHpText.textContent=`${fmt(state.enemy)} / 8,000`;
  heroHp.style.width=(state.hero/1000*100)+"%"; manaFill.style.width=state.mana+"%";
}
function popup(text,x,y,cls=""){
  const d=document.createElement("div"); d.className="damage "+cls; d.textContent=text; d.style.left=x+"%"; d.style.top=y+"%";
  damageLayer.appendChild(d); setTimeout(()=>d.remove(),850);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms/state.speed))}
async function heroAttack(dmg, label="공격"){
  if(!state.running||state.attacking||state.dead)return;
  state.attacking=true; log.textContent=label+"!";
  hero.classList.add("attack"); await wait(230);
  monster.classList.add("hit"); state.enemy-=dmg; state.mana=Math.min(100,state.mana+10);
  popup("-"+fmt(dmg),76,47,dmg>=500?"crit":""); update(); await wait(190);
  hero.classList.remove("attack"); monster.classList.remove("hit"); state.attacking=false;
  if(state.enemy<=0) win();
}
async function enemyAttack(){
  if(!state.running||state.dead)return;
  await wait(450);
  if(!state.running||state.dead)return;
  let dmg=state.guard?45:90;
  state.hero-=dmg; hero.classList.add("hit"); popup("-"+fmt(dmg),24,54); log.textContent=`거수의 공격! ${fmt(dmg)} 피해`;
  update(); await wait(220); hero.classList.remove("hit");
  if(state.hero<=0) lose();
}
async function autoLoop(){
  while(state.running&&!state.dead){
    if(state.auto&&!state.attacking){
      if(state.mana>=95) useSkill("ultimate");
      else if(state.mana>=35) useSkill("slash");
      else heroAttack(125);
    }
    await wait(750);
  }
}
async function enemyLoop(){
  while(state.running&&!state.dead){ await enemyAttack(); }
}
async function useSkill(skill){
  if(!state.running||state.attacking)return;
  if(skill==="slash" && state.mana<25){log.textContent="마나가 부족합니다.";return}
  if(skill==="charge" && state.mana<40){log.textContent="마나가 부족합니다.";return}
  if(skill==="ultimate" && state.mana<95){log.textContent="마나가 부족합니다.";return}
  if(skill==="guard"){
    state.guard=true; log.textContent="수호 자세 발동!"; state.mana=Math.min(100,state.mana+5); update();
    hero.style.filter="drop-shadow(0 0 10px #8ac7ff)"; setTimeout(()=>{state.guard=false;hero.style.filter=""},4500); return;
  }
  const data={slash:[220,"연속 베기"],charge:[330,"돌진"],ultimate:[700,"왕국의 일격"]}[skill];
  state.mana-=skill==="slash"?25:skill==="charge"?40:95; update();
  await heroAttack(data[0],data[1]);
}
function start(){
  if(state.running)return;
  state={enemy:8000,hero:1000,mana:55,running:true,auto:state.auto,speed:state.speed,guard:false,attacking:false,dead:false};
  monster.classList.remove("dead"); monster.style.opacity="1"; battleBtn.textContent="전투 중"; log.textContent="전투가 시작되었습니다.";
  update(); autoLoop(); enemyLoop();
}
function win(){
  state.running=false; state.dead=true; monster.classList.add("dead"); log.textContent="오염된 거수를 정화했습니다."; battleBtn.textContent="승리";
  setTimeout(()=>$("#result").classList.remove("hidden"),650);
}
function lose(){state.running=false;state.dead=true;log.textContent="기사가 쓰러졌습니다.";battleBtn.textContent="재도전";setTimeout(()=>alert("패배했습니다. 다시 전투를 시작해 보세요."),300)}
document.querySelectorAll(".skill").forEach(b=>b.addEventListener("click",()=>useSkill(b.dataset.skill)));
battleBtn.addEventListener("click",start);
autoBtn.addEventListener("click",()=>{state.auto=!state.auto;autoBtn.classList.toggle("on",state.auto);autoBtn.innerHTML=`AUTO <span>${state.auto?"ON":"OFF"}</span>`});
speedBtn.addEventListener("click",()=>{state.speed=state.speed===1?1.5:state.speed===1.5?2:1;$("#speedText").textContent=state.speed+"x"});
$("#pauseBtn").addEventListener("click",()=>$("#pause").classList.remove("hidden"));
$("#resumeBtn").addEventListener("click",()=>$("#pause").classList.add("hidden"));
$("#nextBtn").addEventListener("click",()=>{ $("#result").classList.add("hidden"); start(); });
$("#retreatBtn").addEventListener("click",()=>{state.running=false;state.dead=true;log.textContent="전투에서 후퇴했습니다.";battleBtn.textContent="전투 시작"});
update();
</script>
</body>
</html>
