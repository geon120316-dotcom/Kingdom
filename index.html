<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boss Hunter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1016;touch-action:none;font-family:system-ui,"Noto Sans KR",sans-serif;color:#fff}
#game{position:relative;width:100vw;height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#202938,#161b25 55%,#10131a)}
canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}
.top{height:62px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#0b0e15dd,transparent)}
.stage{font-size:10px;color:#929aaa}.stage b{display:block;font-size:16px;color:#fff}.hpbox{width:145px}.hptext{font-size:10px;text-align:right;margin-bottom:3px}.bar{height:8px;background:#080a0e;border:1px solid #59606d;border-radius:6px;overflow:hidden}.fill{height:100%;background:#4bc66b}
.controls{position:absolute;left:15px;bottom:18px;width:150px;height:150px;pointer-events:auto}.dpad{position:absolute;inset:25px;background:#171b24aa;border:1px solid #4b5361;border-radius:50%}
.dpad button{position:absolute;width:48px;height:48px;border-radius:12px;border:1px solid #59616e;background:#292f3a;color:#dce0e7;font-size:20px}.up{display:none}.down{display:none}.left{left:3px;top:51px}.right{right:3px;top:51px}
.actions{position:absolute;right:17px;bottom:25px;display:flex;gap:10px;align-items:end;pointer-events:auto}.actions button{border-radius:50%;border:2px solid #717988;background:radial-gradient(circle at 35% 25%,#606978,#252a34);box-shadow:0 5px 15px #0008;color:#fff;font-weight:900}.attack{width:78px;height:78px;font-size:15px}.dash{width:56px;height:56px;font-size:11px}.jump{width:64px;height:64px;font-size:12px}
.hint{position:absolute;left:50%;bottom:185px;transform:translateX(-50%);font-size:10px;color:#89919e;background:#0a0d1299;padding:6px 10px;border-radius:8px;white-space:nowrap}
</style></head><body><div id="game"><canvas id="c"></canvas><div class="ui">
<div class="top"><div class="stage">BOSS HUNTER<b>전투 테스트</b></div><div class="hpbox"><div class="hptext">PLAYER <span id="hptext">1000 / 1000</span></div><div class="bar"><div class="fill" id="hp"></div></div></div></div>
<div class="hint">좌우 이동 · 점프 · 대시 · 공격 3회로 스킬 발동</div>
<div class="controls"><div class="dpad"><button class="up" data-k="up">▲</button><button class="down" data-k="down">▼</button><button class="left" data-k="left">◀</button><button class="right" data-k="right">▶</button></div></div>
<div class="actions"><button class="dash" id="dash">회피</button><button class="attack" id="attack">공격</button></div>
</div></div>
<script>
const G=document.getElementById("game"),C=document.getElementById("c"),X=C.getContext("2d");
let W,H,D=1,last=performance.now(),shake=0,particles=[],numbers=[],magicShots=[],skillFx=[];
function size(){W=G.clientWidth;H=G.clientHeight;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}
addEventListener("resize",size);size();

const k={left:0,right:0};
const p={x:0,y:0,vx:0,dir:1,atk:0,atkHit:false,dash:0,dashCd:0,grounded:true,jumpVy:0,
hp:1000,maxHp:1000,class:"검사",combo:0,comboTimer:0,skill:"검기",skillTimer:0};
const b={x:0,y:0,hp:700,maxHp:700,hit:0,scale:1};
p.x=W*.30;p.y=H*.66;b.x=W*.72;b.y=H*.60;

function key(n,v){if(n in k)k[n]=v}
const map={ArrowLeft:"left",ArrowRight:"right",a:"left",d:"right",A:"left",D:"right"};
addEventListener("keydown",e=>{
 if(map[e.key]){e.preventDefault();key(map[e.key],1)}
 if(e.code==="Space"){e.preventDefault();attack()}
 if(e.key==="Shift"){e.preventDefault();dash()}
});
addEventListener("keyup",e=>{if(map[e.key])key(map[e.key],0)});
document.querySelectorAll("[data-k]").forEach(q=>{
 const n=q.dataset.k;if(n!=="left"&&n!=="right")return;
 q.addEventListener("pointerdown",e=>{e.preventDefault();key(n,1)});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>q.addEventListener(t,e=>{e.preventDefault();key(n,0)}));
});

const actions=document.querySelector(".actions");
const jumpBtn=document.createElement("button");jumpBtn.className="jump";jumpBtn.textContent="점프";actions.insertBefore(jumpBtn,actions.firstChild);
jumpBtn.onpointerdown=e=>{e.preventDefault();jump()};
document.getElementById("attack").onpointerdown=e=>{e.preventDefault();attack()};
document.getElementById("dash").onpointerdown=e=>{e.preventDefault();dash()};

function hitFX(x,y){
 for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=100+Math.random()*350;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,t:.38})}
 numbers.push({x:x+(Math.random()-.5)*30,y:y-70,text:Math.floor(45+Math.random()*30),t:.65});
 b.hit=.18;b.scale=1.14;shake=.15;
}
function damageBoss(d){b.hp=Math.max(0,b.hp-d);hitFX(b.x,b.y-45)}
function attack(){
 if(p.atk>0||p.dash>0||p.skillTimer>0)return;
 p.atk=.46;p.atkHit=false;
 setTimeout(()=>{
  if(p.atk<=0||p.atkHit)return;p.atkHit=true;
  if(p.class==="마법사"){
   magicShots.push({x:p.x+p.dir*55,y:p.y-75,vx:p.dir*720,t:1.1,rad:12});
  }else if(Math.abs(b.x-p.x)<(p.class==="검사"?155:130)&&Math.abs(b.y-p.y)<110){
   damageBoss(p.class==="검사"?48:42);
  }
  p.combo++;p.comboTimer=1.2;
  if(p.combo>=3&&p.skill){p.combo=0;p.comboTimer=0;useSkill()}
 },170);
}
function dash(){if(p.dash>0||p.dashCd>0||p.skillTimer>0)return;p.dash=.20;p.dashCd=.65;p.vx=p.dir*720}
function jump(){if(!p.grounded||p.dash>0||p.skillTimer>0)return;p.grounded=false;p.jumpVy=-620}
function useSkill(){
 p.skillTimer=.9;
 if(p.skill==="검기"){skillFx.push({type:"slash",x:p.x+p.dir*65,y:p.y-65,dir:p.dir,t:.65});setTimeout(()=>damageBoss(145),220)}
 if(p.skill==="연속 난타"){
  skillFx.push({type:"rush",x:p.x,y:p.y-50,dir:p.dir,t:.8});
  [0,130,260,390].forEach(d=>setTimeout(()=>{if(Math.abs(b.x-p.x)<190)damageBoss(48)},d));
 }
 if(p.skill==="운석"){skillFx.push({type:"meteor",x:b.x,y:b.y,t:1});setTimeout(()=>damageBoss(190),520)}
}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}

function player(x,y){
 const a=p.atk,t=1-a/.46;let thrust=0;
 if(a>0)thrust=t<.37?t/.37:t<.70?1:1-(t-.70)/.30;
 X.save();X.translate(x,y);X.scale(p.dir,1);
 X.fillStyle="#0008";X.beginPath();X.ellipse(0,15,38,10,0,0,7);X.fill();
 X.fillStyle="#343b47";rr(-18,-25,12,31,5);rr(7,-25,12,31,5);
 X.fillStyle="#566273";rr(-25,-69,50,52,13);X.fillStyle="#252b35";rr(-19,-64,38,38,9);
 X.fillStyle="#b9c0ca";X.beginPath();X.arc(0,-83,22,0,7);X.fill();X.fillStyle="#697586";X.beginPath();X.arc(0,-88,23,3.14,6.28);X.fill();
 rr(-21,-91,42,10,4);X.fillStyle="#181d25";rr(-15,-88,30,7,3);
 if(p.class==="검사"){
  X.save();X.translate(17,-48);let len=73+105*thrust;
  X.strokeStyle="#596574";X.lineWidth=11;X.lineCap="round";X.beginPath();X.moveTo(0,0);X.lineTo(25,8);X.stroke();
  X.strokeStyle="#dce2e8";X.lineWidth=6;X.beginPath();X.moveTo(24,7);X.lineTo(24+len,-8);X.stroke();X.restore();
  if(a>0){X.strokeStyle="#fff1bd";X.lineWidth=5;X.beginPath();X.moveTo(45,-55);X.lineTo(45+len,-63);X.stroke()}
 }else if(p.class==="권투사"){
  let punch=a>0?(t<.38?t/.38:t<.72?1:1-(t-.72)/.28):0;
  X.fillStyle="#c94f4f";X.beginPath();X.arc(31+punch*28,-55,13,0,7);X.fill();
  X.fillStyle="#d8a08a";X.beginPath();X.arc(44+punch*28,-55,10,0,7);X.fill();
 }else{
  X.strokeStyle="#6e4caa";X.lineWidth=9;X.lineCap="round";X.beginPath();X.moveTo(17,-47);X.lineTo(45,-91);X.stroke();
  X.strokeStyle="#d7b6ff";X.lineWidth=4;X.beginPath();X.arc(46,-94,12,0,7);X.stroke();
  if(a>0){X.strokeStyle="#cba6ff";X.lineWidth=3;X.beginPath();X.arc(46,-94,22+6*Math.sin(t*12),0,7);X.stroke()}
 }
 X.restore();
}
function boss(x,y){
 X.save();X.translate(x,y);X.scale(b.scale,b.scale);if(b.hit>0)X.filter="brightness(2.7) saturate(.2)";
 X.fillStyle="#313742";X.beginPath();X.ellipse(0,-35,66,85,0,0,7);X.fill();
 X.fillStyle="#4a5260";X.beginPath();X.arc(-45,-70,30,0,7);X.arc(45,-70,30,0,7);X.fill();
 X.fillStyle="#e05b4b";X.beginPath();X.ellipse(-22,-48,9,5,0,0,7);X.ellipse(22,-48,9,5,0,0,7);X.fill();X.fillStyle="#151920";X.beginPath();X.arc(0,-5,30,0,3.14);X.fill();X.restore();
 X.fillStyle="#090b10";X.fillRect(x-80,y-125,160,8);X.fillStyle="#e34f55";X.fillRect(x-80,y-125,160*Math.max(0,b.hp/b.maxHp),8);
}
function update(dt){
 if(p.atk>0)p.atk-=dt;if(p.dash>0)p.dash-=dt;if(p.dashCd>0)p.dashCd-=dt;if(p.comboTimer>0)p.comboTimer-=dt;else p.combo=0;if(p.skillTimer>0)p.skillTimer-=dt;
 if(b.hit>0)b.hit-=dt;if(b.scale>1)b.scale=Math.max(1,b.scale-dt*1.8);if(shake>0)shake-=dt;
 const dx=(k.right?1:0)-(k.left?1:0);if(dx)p.dir=dx>0?1:-1;
 if(p.dash>0)p.x+=p.vx*dt;
 else if(p.skillTimer<=0&&p.atk<=0){p.vx+=(dx*250-p.vx)*Math.min(1,dt*12);p.x+=p.vx*dt}else p.vx*=Math.max(0,1-dt*12);
 if(!p.grounded){p.jumpVy+=1500*dt;p.y+=p.jumpVy*dt;if(p.y>=H*.66){p.y=H*.66;p.jumpVy=0;p.grounded=true}}
 p.x=Math.max(50,Math.min(W-50,p.x));
 magicShots.forEach(s=>{s.x+=s.vx*dt;s.t-=dt;if(Math.abs(s.x-b.x)<35&&Math.abs(s.y-(b.y-45))<75){damageBoss(44);s.t=0}});
 magicShots=magicShots.filter(s=>s.t>0&&s.x>-50&&s.x<W+50);
 particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.t-=dt});particles=particles.filter(q=>q.t>0);
 numbers.forEach(q=>{q.y-=45*dt;q.t-=dt});numbers=numbers.filter(q=>q.t>0);
 skillFx.forEach(f=>f.t-=dt);skillFx=skillFx.filter(f=>f.t>0);
}
function draw(){
 X.clearRect(0,0,W,H);X.save();if(shake>0)X.translate((Math.random()-.5)*9,(Math.random()-.5)*7);
 X.fillStyle="#252d3b";X.fillRect(0,H*.27,W,H*.73);X.fillStyle="#151920";X.beginPath();X.ellipse(W/2,H*.73,W*.62,45,0,0,7);X.fill();
 magicShots.forEach(s=>{X.save();X.translate(s.x,s.y);X.shadowBlur=20;X.shadowColor="#b889ff";X.fillStyle="#e6c9ff";X.beginPath();X.arc(0,0,s.rad,0,7);X.fill();X.strokeStyle="#a66cff";X.lineWidth=4;X.beginPath();X.arc(0,0,19,0,7);X.stroke();X.restore()});
 boss(b.x,b.y);player(p.x,p.y);
 skillFx.forEach(f=>{
  X.save();
  if(f.type==="slash"){X.translate(f.x,f.y);X.scale(f.dir,1);X.globalAlpha=Math.min(1,f.t*2);X.strokeStyle="#fff0b0";X.lineWidth=18;X.beginPath();X.moveTo(0,0);X.lineTo(220,-20);X.stroke();X.strokeStyle="#fff";X.lineWidth=4;X.beginPath();X.moveTo(10,-4);X.lineTo(235,-24);X.stroke()}
  if(f.type==="rush"){X.globalAlpha=.75;X.strokeStyle="#f3c76a";X.lineWidth=8;X.beginPath();X.moveTo(f.x-80,f.y-50);X.lineTo(f.x+160*f.dir,f.y-50);X.stroke()}
  if(f.type==="meteor"){X.translate(f.x,f.y);X.globalAlpha=Math.min(1,(1-f.t)*2);X.strokeStyle="#b889ff";X.lineWidth=5;X.beginPath();X.arc(0,-125,55,0,7);X.stroke();X.beginPath();X.arc(0,-125,38,0,7);X.stroke();X.fillStyle="#d8b0ff";X.beginPath();X.moveTo(-24,-80);X.lineTo(0,0);X.lineTo(24,-80);X.closePath();X.fill()}
  X.restore();
 });
 particles.forEach(q=>{X.globalAlpha=Math.max(0,q.t/.38);X.fillStyle="#fff1bd";X.beginPath();X.arc(q.x,q.y,q.r,0,7);X.fill()});
 numbers.forEach(q=>{X.globalAlpha=Math.max(0,q.t/.65);X.fillStyle="#fff";X.font="bold 22px system-ui";X.textAlign="center";X.fillText("-"+q.text,q.x,q.y)});
 X.restore();
 document.getElementById("hptext").textContent=`${p.hp} / ${p.maxHp}`;document.getElementById("hp").style.width=(p.hp/p.maxHp*100)+"%";
 document.querySelector(".hint").textContent=p.skill?`스킬: ${p.skill} · 공격 ${p.combo}/3`:"공격 3회로 스킬 발동";
 requestAnimationFrame(loop);
}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw()}requestAnimationFrame(loop);
</script></body></html>
